<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Shortlister</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e3e6ec;
    --brand: #2f5bea; --brand-soft: #e8eefe; --good: #137a4b; --good-soft: #e3f5ec;
    --bad: #b42318; --bad-soft: #fdeceb; --warn: #8a5a00; --warn-soft: #fff4d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px;
           display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; }
  .pill { background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; color: var(--ink); }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:disabled { opacity: .55; cursor: default; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 860px; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; padding: 8px 14px; border-radius: 14px 14px 2px 14px; max-width: 70%; }
  .msg.bot { align-self: flex-start; width: 100%; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 14px 2px; padding: 12px 16px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 6px 0 8px 18px; padding: 0; } .bubble li { margin: 3px 0; }
  .typing { color: var(--muted); font-style: italic; }
  .summary { color: var(--muted); font-size: 13px; margin: 10px 2px 6px; }
  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          display: grid; grid-template-columns: 34px 1fr 120px; gap: 4px 12px; }
  .rank { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
          display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .who { font-weight: 650; }
  .tag { font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 1px 6px; margin-left: 6px; font-weight: 500; }
  .score { text-align: right; }
  .score b { font-size: 20px; }
  .bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--brand); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .chips { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: 12.5px; border-radius: 6px; padding: 1px 8px; background: var(--good-soft); color: var(--good); }
  .chip.miss { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--bg); color: var(--muted); }
  .excerpt { grid-column: 2 / 4; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 4px; }
  .excerpt div { margin: 2px 0; } .excerpt .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  a { color: var(--brand); text-decoration: none; } a:hover { text-decoration: underline; }
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 20px 14px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .suggest { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--muted); }
  .suggest:hover { color: var(--ink); border-color: #c8cdd8; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; max-height: 140px; }
  textarea:focus, select:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  select { font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; background: var(--panel); max-width: 190px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .crit { margin-bottom: 18px; } .crit .k { font-size: 12.5px; color: var(--muted); margin: 8px 0 3px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px 10px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  #uploadStatus { font-size: 13px; margin-top: 8px; }
  .empty { color: var(--muted); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Resume Shortlister</h1>
  <span class="pill" id="count">loading...</span>
  <span class="spacer"></span>
  <button class="btn" id="resetBtn">New search</button>
</header>
<main>
  <section class="chat">
    <div id="thread"></div>
    <div class="composer">
      <div class="chips-row" id="suggestions"></div>
      <div class="row">
        <select id="scope" title="Which part of the resumes to search">
          <option value="auto">Search in: let me decide</option>
          <option value="all">Whole resume</option>
          <option value="experience">Experience only</option>
          <option value="experience+projects">Experience + projects</option>
          <option value="projects">Projects only</option>
          <option value="skills">Skills only</option>
          <option value="education">Education only</option>
          <option value="certifications">Certifications only</option>
          <option value="summary">Summary only</option>
          <option value="accomplishments">Accomplishments only</option>
        </select>
        <textarea id="box" rows="1" placeholder="Describe the role and skills, e.g. DevOps engineer with AWS and Terraform"></textarea>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
    </div>
  </section>
  <aside>
    <div class="crit">
      <h2>Current search</h2>
      <div id="criteria" class="empty">Nothing yet. Describe the role you are hiring for.</div>
    </div>
    <h2>Add a resume</h2>
    <div class="drop" id="drop">Drop a PDF, Word or text file here<br>or <a href="#" id="pick">choose a file</a></div>
    <input type="file" id="file" accept=".pdf,.docx,.txt" hidden>
    <div id="uploadStatus"></div>
  </aside>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const thread = $("thread"), box = $("box"), sendBtn = $("sendBtn");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* Replies may contain **bold** and "* item" bullets; everything is escaped first (resume text is untrusted). */
function formatReply(text) {
  const root = el("div");
  let list = null;
  const inline = (parent, s) => {
    s.split(/(\*\*[^*]+\*\*)/).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) parent.appendChild(el("strong", "", part.slice(2, -2)));
      else if (part) parent.appendChild(document.createTextNode(part));
    });
  };
  text.split("\n").forEach((line) => {
    const m = line.match(/^\s*[*\-•]\s+(.*)$/);
    if (m) {
      if (!list) { list = el("ul"); root.appendChild(list); }
      const li = el("li"); inline(li, m[1]); list.appendChild(li);
    } else {
      list = null;
      if (line.trim()) { const p = el("p"); inline(p, line.trim()); root.appendChild(p); }
    }
  });
  return root;
}

function scrollDown() { thread.scrollTop = thread.scrollHeight; }
function addUser(text) { thread.appendChild(el("div", "msg user", text)); scrollDown(); }

function addBot(data) {
  const wrap = el("div", "msg bot");
  const bubble = el("div", "bubble");
  bubble.appendChild(formatReply(data.reply || ""));
  wrap.appendChild(bubble);
  if (data.kind === "search" && data.results && data.results.length) {
    if (data.summary) wrap.appendChild(el("div", "summary", data.summary));
    const cards = el("div", "cards");
    data.results.forEach((r) => cards.appendChild(card(r)));
    wrap.appendChild(cards);
  }
  thread.appendChild(wrap);
  scrollDown();
  return wrap;
}

function card(r) {
  const c = el("div", "card");
  c.appendChild(el("div", "rank", String(r.rank)));
  const mid = el("div");
  const who = el("div", "who", r.name.replace(" (sample name)", ""));
  if (r.placeholder) { const t = el("span", "tag", "sample name"); t.title = "Placeholder name shared by many resumes: identify by file"; who.appendChild(t); }
  mid.appendChild(who);
  const sub = el("div", "sub");
  const a = el("a", "", r.file); a.href = r.file_url; a.target = "_blank"; a.rel = "noopener";
  sub.appendChild(a);
  const exp = r.years == null ? "experience unknown" : "about " + r.years + " yrs (" + r.years_source + ")";
  sub.appendChild(document.createTextNode("  ·  " + exp));
  mid.appendChild(sub);
  c.appendChild(mid);
  const sc = el("div", "score");
  sc.appendChild(el("b", "", r.score.toFixed(1)));
  const bar = el("div", "bar"); const fill = el("i"); fill.style.width = Math.max(0, Math.min(100, r.score)) + "%";
  bar.appendChild(fill); sc.appendChild(bar);
  sc.appendChild(el("div", "sub", "keywords " + r.keyword_score + " · meaning " + r.semantic_score));
  c.appendChild(sc);
  const chips = el("div", "chips");
  r.has.forEach((h) => chips.appendChild(el("span", "chip", h.skill + " ×" + h.count)));
  r.missing.forEach((m) => chips.appendChild(el("span", "chip miss", "missing: " + m)));
  if (!r.has.length && !r.missing.length) chips.appendChild(el("span", "chip info", "ranked by meaning"));
  c.appendChild(chips);
  if (r.excerpt && r.excerpt.length) {
    const ex = el("div", "excerpt");
    ex.appendChild(el("div", "lbl", "From " + r.sections.join(" / ")));
    r.excerpt.forEach((line) => ex.appendChild(el("div", "", line)));
    c.appendChild(ex);
  }
  return c;
}

function showCriteria(spec) {
  const box = $("criteria");
  box.textContent = ""; box.className = "crit-body";
  const empty = !spec || !(spec.query || spec.must_have.length || spec.nice_to_have.length || spec.min_years != null || spec.max_years != null);
  if (empty) { box.className = "empty"; box.textContent = "Nothing yet. Describe the role you are hiring for."; return; }
  const row = (label, items) => {
    if (!items || !items.length) return;
    box.appendChild(el("div", "k", label));
    const w = el("div", "chips"); w.style.gridColumn = "auto";
    items.forEach((i) => w.appendChild(el("span", "chip" + (label === "Nice to have" ? " info" : ""), i)));
    box.appendChild(w);
  };
  if (spec.query) { box.appendChild(el("div", "k", "Role")); box.appendChild(el("div", "", spec.query)); }
  row("Must have", spec.must_have);
  row("Nice to have", spec.nice_to_have);
  if (spec.min_years != null || spec.max_years != null) {
    const lo = spec.min_years != null ? spec.min_years : 0;
    row("Experience", [spec.max_years != null ? lo + " to " + spec.max_years + " years" : lo + "+ years"]);
  }
  row("Looking only in", spec.sections);
  if (spec.strict) row("Mode", ["strict: must-haves required"]);
  row("Showing", ["top " + spec.top_n]);
}

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({ error: "Unexpected reply from the server" }));
  if (!res.ok && !data.error) data.error = "Request failed (" + res.status + ")";
  return data;
}

async function send(text) {
  text = (text || box.value).trim();
  if (!text || sendBtn.disabled) return;
  box.value = ""; autosize();
  addUser(text);
  sendBtn.disabled = true;
  const wait = el("div", "msg bot"); wait.appendChild(el("div", "bubble typing", "Searching the resumes..."));
  thread.appendChild(wait); scrollDown();
  try {
    const data = await post("/api/chat", { message: text, scope: $("scope").value });
    wait.remove();
    if (data.error) { addBot({ reply: "Sorry, something went wrong: " + data.error }); }
    else { addBot(data); showCriteria(data.spec); $("count").textContent = data.candidates + " resumes indexed"; }
  } catch (e) {
    wait.remove(); addBot({ reply: "Could not reach the server. Is gui_app.py still running?" });
  } finally { sendBtn.disabled = false; box.focus(); }
}

function autosize() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 140) + "px"; }
box.addEventListener("input", autosize);
box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener("click", () => send());

const SUGGESTIONS = ["Only those with all of them", "Why is #1 ranked first?", "Compare the top two", "Show 20 results"];
SUGGESTIONS.forEach((s) => { const b = el("button", "suggest", s); b.addEventListener("click", () => send(s)); $("suggestions").appendChild(b); });

$("resetBtn").addEventListener("click", async () => {
  await post("/api/reset");
  thread.textContent = ""; showCriteria(null); greet();
});

/* ---- upload ---- */
const drop = $("drop"), fileInput = $("file"), upStatus = $("uploadStatus");
$("pick").addEventListener("click", (e) => { e.preventDefault(); fileInput.click(); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); fileInput.value = ""; });
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) upload(f); });

async function upload(file) {
  upStatus.textContent = "Adding " + file.name + " ... (scanned PDFs can take a minute)";
  const form = new FormData(); form.append("file", file);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    if (data.error) { upStatus.textContent = data.error; return; }
    const info = data.info || {};
    if (info.status === "added") {
      upStatus.textContent = "Added " + (info.name || info.candidate_id) + " (" + info.read_via + ").";
      $("count").textContent = data.candidates + " resumes indexed";
      if (data.refreshed) { addBot(data.refreshed); showCriteria(data.refreshed.spec); }
    } else { upStatus.textContent = info.candidate_id + ": " + info.status; }
  } catch (e) { upStatus.textContent = "Upload failed: " + e; }
}

function greet() {
  addBot({ reply: "Hi! Tell me the role and skills you are hiring for, for example: DevOps engineer with AWS and Terraform, bonus for Kubernetes. " +
                  "You can then keep refining, ask why someone ranked where they did, or pick a resume section in the box below to search only there." });
}

(async function init() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("count").textContent = s.candidates + " resumes indexed";
    showCriteria(s.spec);
  } catch (e) { $("count").textContent = "server not reachable"; }
  greet(); box.focus();
})();
</script>
</body>
</html>
